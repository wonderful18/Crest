namespace: crest-internal

resources:
  - ../internal-mysql
  - ../observability

patches:
  - path: observability-env-patch.yaml

configMapGenerator:
  - name: crest-env
    behavior: merge
    literals:
      - CREST_PROMETHEUS_ENABLED=true
      - CREST_PROMETHEUS_MAX_URI_TAGS=200
      - CREST_GRAFANA_ENABLED=true
      - CREST_GRAFANA_PUBLIC_URL=http://localhost:3000

generatorOptions:
  disableNameSuffixHash: true
