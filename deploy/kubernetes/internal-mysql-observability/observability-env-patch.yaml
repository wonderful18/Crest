apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-service
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: crest-service
          env:
            - name: CREST_PROMETHEUS_ENABLED
              value: "true"
            - name: CREST_PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crest-observability-secret
                  key: CREST_PROMETHEUS_TOKEN
            - name: CREST_PROMETHEUS_MAX_URI_TAGS
              value: "200"
            - name: CREST_GRAFANA_ENABLED
              value: "true"
            - name: CREST_GRAFANA_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: crest-env
                  key: CREST_GRAFANA_PUBLIC_URL
                  optional: true
