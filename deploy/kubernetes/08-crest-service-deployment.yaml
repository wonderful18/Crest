apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-service
  labels:
    app.kubernetes.io/name: crest-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-service
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: crest-service
          image: ghcr.io/sevoniva/crest-service:v2.0.3-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: CREST_RUNTIME_ROLE
              value: all
            - name: CREST_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: crest-env
            - secretRef:
                name: crest-db-secret
            - secretRef:
                name: crest-redis-secret
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: crest-data
              mountPath: /opt/crest/data
      volumes:
        - name: crest-data
          persistentVolumeClaim:
            claimName: crest-data
