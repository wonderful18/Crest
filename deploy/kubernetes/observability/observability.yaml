apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-prometheus
  labels:
    app.kubernetes.io/name: crest-prometheus
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest-prometheus
        app.kubernetes.io/part-of: crest
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.12.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: prometheus-token
              mountPath: /etc/prometheus/secrets
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: crest-prometheus-config
        - name: prometheus-rules
          configMap:
            name: crest-prometheus-rules
        - name: prometheus-token
          secret:
            secretName: crest-observability-secret
            items:
              - key: CREST_PROMETHEUS_TOKEN
                path: crest-token
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: crest-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: crest-prometheus
  labels:
    app.kubernetes.io/name: crest-prometheus
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crest-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-grafana
  labels:
    app.kubernetes.io/name: crest-grafana
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest-grafana
        app.kubernetes.io/part-of: crest
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana-oss:13.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crest-observability-secret
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_LOG_LEVEL
              value: error
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                configMapKeyRef:
                  name: crest-env
                  key: CREST_GRAFANA_PUBLIC_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus-datasource.yml
              readOnly: true
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: crest-grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: crest-grafana-dashboards
        - name: grafana-data
          persistentVolumeClaim:
            claimName: crest-grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: crest-grafana
  labels:
    app.kubernetes.io/name: crest-grafana
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crest-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
