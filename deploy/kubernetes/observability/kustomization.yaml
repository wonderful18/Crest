resources:
  - observability.yaml
  - networkpolicy.yaml
  - pvc.yaml

configMapGenerator:
  - name: crest-prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.yml
  - name: crest-prometheus-rules
    files:
      - crest-alerts.yml=prometheus/rules/crest-alerts.yml
  - name: crest-grafana-datasources
    files:
      - prometheus-datasource.yml=grafana/datasources/prometheus.yml
  - name: crest-grafana-dashboards
    files:
      - dashboards.yml=grafana/dashboards/dashboards.yml
      - crest-alerts-slo.json=grafana/dashboards/crest-alerts-slo.json
      - crest-api-monitoring.json=grafana/dashboards/crest-api-monitoring.json
      - crest-database-pool.json=grafana/dashboards/crest-database-pool.json
      - crest-jvm-runtime.json=grafana/dashboards/crest-jvm-runtime.json
      - crest-service-overview.json=grafana/dashboards/crest-service-overview.json
      - crest-task-cache.json=grafana/dashboards/crest-task-cache.json

generatorOptions:
  disableNameSuffixHash: true
