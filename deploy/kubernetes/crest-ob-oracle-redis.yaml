apiVersion: v1
kind: ConfigMap
metadata:
  name: crest-env
data:
  CREST_ORIGIN_LIST: "https://crest.example.com"
  CREST_PRODUCTION_MODE: "true"
  SPRING_PROFILES_ACTIVE: "standalone"
  CREST_LOAD_DEMO: "false"
  CREST_FLYWAY_ENABLED: "false"
  CREST_DB_TYPE: "ob-oracle"
  CREST_DB_DRIVER_CLASS_NAME: "com.oceanbase.jdbc.Driver"
  CREST_DB_HOST: "obproxy.example.com"
  CREST_DB_PORT: "2883"
  CREST_DB_URL: "jdbc:oceanbase://obproxy.example.com:2883"
  CREST_REDIS_HOST: "crest-redis"
  CREST_REDIS_PORT: "6379"
  CREST_REDIS_DATABASE: "0"
---
apiVersion: v1
kind: Secret
metadata:
  name: crest-db-secret
type: Opaque
stringData:
  CREST_DB_USERNAME: "CHANGE_ME_OB_USER"
  CREST_DB_PASSWORD: "CHANGE_ME_OB_PASSWORD"
  CREST_AES_KEY: "LXPkHvam!oVTz2Bvco0g9U!OR,u2CmWU"
  CREST_AES_IV: "I,_dp%!4vQ3yM!Wb"
  CREST_INITIAL_PASSWORD: "l1OelVKSN1TCeG2L9LV4q1mh"
  CREST_TOKEN_SECRET: "s=sGuSareFQTrZPom9vJbS,E!6ui_s=uZV@mg.+piU_duQRlGlxd+cLLosQq+sAH"
---
apiVersion: v1
kind: Secret
metadata:
  name: crest-redis-secret
type: Opaque
stringData:
  CREST_REDIS_PASSWORD: "a.P6UMn1QtXc4v1%DUO@QndvhoUwdadke3HeaRm=CO18umod"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crest-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: <storage-class>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crest-redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: <storage-class>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crest-redis-config
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    databases 16
    dir /data
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 1024mb
    maxmemory-policy noeviction
    loglevel notice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-redis
  labels:
    app.kubernetes.io/name: crest-redis
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-redis
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest-redis
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:6.2.19
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(CREST_REDIS_PASSWORD)
          ports:
            - name: redis
              containerPort: 6379
          envFrom:
            - secretRef:
                name: crest-redis-secret
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: crest-redis-config
        - name: redis-data
          persistentVolumeClaim:
            claimName: crest-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: crest-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crest-redis
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-service
  labels:
    app.kubernetes.io/name: crest-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-service
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: crest-service
          image: ghcr.io/sevoniva/crest-service:v2.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: CREST_RUNTIME_ROLE
              value: all
            - name: CREST_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: crest-env
            - secretRef:
                name: crest-db-secret
            - secretRef:
                name: crest-redis-secret
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: crest-data
              mountPath: /opt/crest/data
      volumes:
        - name: crest-data
          persistentVolumeClaim:
            claimName: crest-data
---
apiVersion: v1
kind: Service
metadata:
  name: crest-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crest-service
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8100
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crest-nginx-config
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /var/run/nginx/nginx.pid;
    events { worker_connections 4096; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      sendfile on;
      keepalive_timeout 65s;
      client_max_body_size 500m;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
      }
      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    upstream crest_backend {
      server crest-service:8100;
      keepalive 32;
    }
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      server_tokens off;
      absolute_redirect off;
      client_max_body_size 500m;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;

      location = /healthz {
        access_log off;
        return 204;
      }
      location = /api/v1/actuator/prometheus {
        access_log off;
        return 404;
      }
      location ^~ /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://crest_backend/api/v1/;
      }
      location /websocket {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_pass http://crest_backend/websocket;
      }
      location ~ /\.(?!well-known) {
        return 404;
      }
      location ~* \.map$ {
        return 404;
      }
      location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest
  labels:
    app.kubernetes.io/name: crest
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: crest
          image: ghcr.io/sevoniva/crest-web:v2.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: crest-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: crest-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: crest-nginx-config
          configMap:
            name: crest-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: crest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crest
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8100
      targetPort: http
