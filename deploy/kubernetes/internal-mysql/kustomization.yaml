namespace: crest-internal

resources:
  - namespace.yaml
  - ../base
  - mysql.yaml

configMapGenerator:
  - name: crest-env
    literals:
      - CREST_CONTEXT_PATH=
      - CREST_LOAD_DEMO=true
      - CREST_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/demo-migration
      - CREST_DB_HOST=crest-mysql
      - CREST_DB_PORT=3306
      - CREST_DB_NAME=crest
      - CREST_DB_TYPE=mysql
      - CREST_DB_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - CREST_DB_PARAMS=autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - CREST_ORIGIN_LIST=http://localhost:18100,http://127.0.0.1:18100,http://localhost:8100
      - CREST_LOGIN_TIMEOUT=960
  - name: crest-mysql-init
    files:
      - 01-init.sql=mysql-init.sql
      - my.cnf=mysql-my.cnf

generatorOptions:
  disableNameSuffixHash: true
