namespace: crest-external

resources:
  - namespace.yaml
  - ../base

configMapGenerator:
  - name: crest-env
    literals:
      - CREST_CONTEXT_PATH=
      - CREST_LOAD_DEMO=true
      - CREST_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/demo-migration
      - CREST_DB_HOST=host.docker.internal
      - CREST_DB_PORT=13306
      - CREST_DB_NAME=crest_k8s_external
      - CREST_DB_TYPE=mysql
      - CREST_DB_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - CREST_DB_URL=jdbc:mysql://host.docker.internal:13306/crest_k8s_external?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - CREST_DB_PARAMS=autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - CREST_ORIGIN_LIST=http://localhost:18101,http://127.0.0.1:18101,http://localhost:8100
      - CREST_LOGIN_TIMEOUT=960

generatorOptions:
  disableNameSuffixHash: true
