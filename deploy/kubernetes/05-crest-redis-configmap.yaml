apiVersion: v1
kind: ConfigMap
metadata:
  name: crest-redis-config
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    databases 16
    dir /data
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 1024mb
    maxmemory-policy noeviction
    loglevel notice
