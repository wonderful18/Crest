apiVersion: v1
kind: ConfigMap
metadata:
  name: crest-app-config
data:
  application.yml: |
    server:
      port: 8100
      servlet:
        context-path: ${CREST_CONTEXT_PATH:}

    spring:
      datasource:
        url: jdbc:mysql://${CREST_DB_HOST}:${CREST_DB_PORT}/${CREST_DB_NAME}?${CREST_DB_PARAMS}
      messages:
        basename: i18n/lic,i18n/core,i18n/permissions,i18n/sync
      flyway:
        enabled: true
        table: crest_schema_version
        validate-on-migrate: false
        locations: ${CREST_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo-migration}
        baseline-on-migrate: true
        out-of-order: false

    management:
      endpoints:
        enabled-by-default: false
        web:
          base-path: /api/v1/actuator
          exposure:
            include: prometheus
      endpoint:
        prometheus:
          enabled: ${CREST_PROMETHEUS_ENABLED:false}
      health:
        redis:
          enabled: false
      prometheus:
        metrics:
          export:
            enabled: ${CREST_PROMETHEUS_ENABLED:false}
      metrics:
        tags:
          application: crest-service
        distribution:
          percentiles-histogram:
            http.server.requests: true
          percentiles:
            http.server.requests: 0.5,0.9,0.95,0.99

    logging:
      file:
        path: ${CREST_LOG_PATH:/opt/crest/logs/crest}
      level:
        "org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker": ERROR

    mybatis-plus:
      mapper-locations: classpath:mybatis/*.xml

    crest:
      internal-lite:
        enabled: true
      demo:
        enabled: ${CREST_LOAD_DEMO:true}
      origin-list: ${CREST_ORIGIN_LIST:http://localhost:8100}
      login_timeout: ${CREST_LOGIN_TIMEOUT:960}
      path:
        excel: ${CREST_PATH_EXCEL:/opt/crest/data/excel/}
        exportData: ${CREST_PATH_EXPORT_DATA:/opt/crest/data/exportData/}
        ehcache: ${CREST_PATH_EHCACHE:/opt/crest/cache}
      crypto:
        mode: ${CREST_CRYPTO_MODE:standard}
      observability:
        prometheus:
          enabled: ${CREST_PROMETHEUS_ENABLED:false}
          endpoint: /api/v1/actuator/prometheus
          max-uri-tags: ${CREST_PROMETHEUS_MAX_URI_TAGS:200}
        grafana:
          enabled: ${CREST_GRAFANA_ENABLED:false}
          public-url: ${CREST_GRAFANA_PUBLIC_URL:}
