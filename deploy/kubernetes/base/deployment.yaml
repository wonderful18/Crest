apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-service
  labels:
    app.kubernetes.io/name: crest-service
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-service
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest-service
        app.kubernetes.io/part-of: crest
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: crest
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: ghcr.io/sevoniva/crest-service:v1.5.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              until nc -z "$CREST_DB_HOST" "$CREST_DB_PORT"; do
                echo "waiting for database ${CREST_DB_HOST}:${CREST_DB_PORT}"
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: crest-env
            - secretRef:
                name: crest-db-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: seed-static-resource
          image: ghcr.io/sevoniva/crest-service:v1.5.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              mkdir -p /work/static-resource
              cp -an /opt/apps/staticResource/. /work/static-resource/ 2>/dev/null || true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crest-data
              mountPath: /work/static-resource
              subPath: static-resource
      containers:
        - name: crest-service
          image: ghcr.io/sevoniva/crest-service:v1.5.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: RUNNING_PORT
              value: "8100"
            - name: JAVA_APP_JAR
              value: /opt/apps/app.jar
            - name: JAVA_OPTS
              value: >-
                -Dfile.encoding=utf-8
                -Djava.awt.headless=true
                -Dloader.path=/opt/apps
                -Djava.io.tmpdir=/opt/crest/tmp
                -Dspring.config.additional-location=/opt/apps/config/
            - name: CREST_PATH_EXCEL
              value: /opt/crest/data/excel/
            - name: CREST_PATH_EXPORT_DATA
              value: /opt/crest/data/exportData/
            - name: CREST_PATH_EHCACHE
              value: /opt/crest/cache
            - name: CREST_LOG_PATH
              value: /opt/crest/logs/crest
          envFrom:
            - configMapRef:
                name: crest-env
            - secretRef:
                name: crest-db-secret
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -qO- "http://127.0.0.1:${RUNNING_PORT}${CREST_CONTEXT_PATH:-}/api/v1/actuator/health/liveness" >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -qO- "http://127.0.0.1:${RUNNING_PORT}${CREST_CONTEXT_PATH:-}/api/v1/actuator/health/readiness" >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -qO- "http://127.0.0.1:${RUNNING_PORT}${CREST_CONTEXT_PATH:-}/api/v1/actuator/health/liveness" >/dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crest-app-config
              mountPath: /opt/apps/config/application.yml
              subPath: application.yml
              readOnly: true
            - name: crest-cache
              mountPath: /opt/crest/cache
            - name: crest-logs
              mountPath: /opt/crest/logs/crest
            - name: crest-tmp
              mountPath: /opt/crest/tmp
            - name: crest-data
              mountPath: /opt/crest/data/static-resource
              subPath: static-resource
            - name: crest-data
              mountPath: /opt/crest/data/appearance
              subPath: appearance
            - name: crest-data
              mountPath: /opt/crest/data/exportData
              subPath: exportData
            - name: crest-data
              mountPath: /opt/crest/data/excel
              subPath: excel
            - name: crest-data
              mountPath: /opt/crest/data/font
              subPath: font
            - name: crest-data
              mountPath: /opt/crest/data/i18n
              subPath: i18n
      volumes:
        - name: crest-app-config
          configMap:
            name: crest-app-config
        - name: crest-cache
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: crest-logs
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: crest-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: crest-data
          persistentVolumeClaim:
            claimName: crest-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest
  labels:
    app.kubernetes.io/name: crest
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest
        app.kubernetes.io/part-of: crest
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: crest
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crest
          image: ghcr.io/sevoniva/crest-web:v1.5.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crest-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: crest-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-client-temp
              mountPath: /var/cache/nginx/client_temp
            - name: nginx-proxy-temp
              mountPath: /var/cache/nginx/proxy_temp
            - name: nginx-fastcgi-temp
              mountPath: /var/cache/nginx/fastcgi_temp
            - name: nginx-uwsgi-temp
              mountPath: /var/cache/nginx/uwsgi_temp
            - name: nginx-scgi-temp
              mountPath: /var/cache/nginx/scgi_temp
            - name: nginx-run
              mountPath: /var/run/nginx
      volumes:
        - name: crest-nginx-config
          configMap:
            name: crest-nginx-config
        - name: nginx-client-temp
          emptyDir:
            sizeLimit: 128Mi
        - name: nginx-proxy-temp
          emptyDir:
            sizeLimit: 256Mi
        - name: nginx-fastcgi-temp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-uwsgi-temp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-scgi-temp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
