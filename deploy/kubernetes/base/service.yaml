apiVersion: v1
kind: Service
metadata:
  name: crest-service
  labels:
    app.kubernetes.io/name: crest-service
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crest-service
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8100
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: crest
  labels:
    app.kubernetes.io/name: crest
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crest
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8100
      targetPort: http
