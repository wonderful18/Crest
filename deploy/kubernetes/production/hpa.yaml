apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crest-service-api
  labels:
    app.kubernetes.io/name: crest-service-api
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: api
spec:
  minReplicas: 2
  maxReplicas: 6
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crest-service-api
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
