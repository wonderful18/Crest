apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crest-service-api
  labels:
    app.kubernetes.io/name: crest-service-api
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-service-api
      app.kubernetes.io/component: api
