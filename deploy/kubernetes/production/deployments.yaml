          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -qO- "http://127.0.0.1:${RUNNING_PORT}${CREST_CONTEXT_PATH:-}/api/v1/actuator/health/liveness" >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
