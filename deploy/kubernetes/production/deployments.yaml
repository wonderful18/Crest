            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crest-app-config
              mountPath: /opt/apps/config/application.yml
              subPath: application.yml
              readOnly: true
            - name: crest-cache
              mountPath: /opt/crest/cache
            - name: crest-logs
              mountPath: /opt/crest/logs/crest
            - name: crest-tmp
