                name: crest-redis-secret
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: prepare-data-volume
          image: ghcr.io/sevoniva/crest-service:v2.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              for dir in static-resource appearance exportData excel font report custom-drivers i18n; do
                mkdir -p "/work/data/${dir}"
                chmod -R u+rwX,g+rwX,o-rwx "/work/data/${dir}"
                chown -R 10001:10001 "/work/data/${dir}"
              done
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: crest-data
              mountPath: /work/data
      containers:
        - name: crest-service
          image: ghcr.io/sevoniva/crest-service:v2.0.0
