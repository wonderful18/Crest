apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest-service-api
  labels:
    app.kubernetes.io/name: crest-service-api
    app.kubernetes.io/part-of: crest
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: crest-service-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crest-service-api
        app.kubernetes.io/part-of: crest
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: crest
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: crest-service-api
                    app.kubernetes.io/component: api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crest-service-api
              app.kubernetes.io/component: api
      initContainers:
        - name: wait-for-database
          image: ghcr.io/sevoniva/crest-service:v2.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              DB_HOST="${CREST_DB_HOST:-}"
              DB_PORT="${CREST_DB_PORT:-}"
              if [ -z "$DB_HOST" ] && [ -n "${CREST_DB_URL:-}" ]; then
                DB_ENDPOINT="${CREST_DB_URL#*://}"
                DB_ENDPOINT="${DB_ENDPOINT%%/*}"
                DB_ENDPOINT="${DB_ENDPOINT%%\?*}"
                DB_HOST="${DB_ENDPOINT%%:*}"
                if [ "$DB_ENDPOINT" != "$DB_HOST" ]; then
                  DB_PORT="${DB_ENDPOINT##*:}"
                fi
              fi
              if [ -z "$DB_PORT" ]; then
                case "${CREST_DB_TYPE:-mysql}" in
                  ob-*) DB_PORT=2883 ;;
                  *) DB_PORT=3306 ;;
                esac
              fi
              if [ -z "$DB_HOST" ]; then
                echo "CREST_DB_HOST or CREST_DB_URL host is required"
                exit 1
              fi
              until nc -z "$DB_HOST" "$DB_PORT"; do
                echo "waiting for database ${DB_HOST}:${DB_PORT}"
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: crest-env
            - secretRef:
                name: crest-db-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: wait-for-redis
          image: ghcr.io/sevoniva/crest-service:v2.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              REDIS_NODES="$(printf '%s' "${CREST_REDIS_CLUSTER_NODES:-}" | tr -d '[:space:]')"
              if [ -n "$REDIS_NODES" ]; then
                until [ "${REDIS_AVAILABLE:-0}" = "1" ]; do
                  REDIS_AVAILABLE=0
                  OLD_IFS="$IFS"
                  IFS=","
                  set -- $REDIS_NODES
                  IFS="$OLD_IFS"
                  for REDIS_ENDPOINT in "$@"; do
                    if [ -z "$REDIS_ENDPOINT" ]; then
                      continue
                    fi
                    REDIS_HOST="${REDIS_ENDPOINT%:*}"
                    REDIS_PORT="${REDIS_ENDPOINT##*:}"
                    if [ "$REDIS_PORT" = "$REDIS_HOST" ]; then
                      REDIS_PORT="${CREST_REDIS_PORT:-6379}"
                    fi
                    if nc -z "$REDIS_HOST" "$REDIS_PORT"; then
                      REDIS_AVAILABLE=1
                      break
                    fi
                  done
                  if [ "$REDIS_AVAILABLE" = "1" ]; then
                    break
                  fi
                  echo "waiting for redis cluster ${REDIS_NODES}"
                  sleep 2
                done
              else
                REDIS_HOST="${CREST_REDIS_HOST}"
                REDIS_PORT="${CREST_REDIS_PORT:-6379}"
                if [ -z "$REDIS_HOST" ]; then
                  echo "CREST_REDIS_HOST or CREST_REDIS_CLUSTER_NODES is required"
                  exit 1
                fi
                until nc -z "$REDIS_HOST" "$REDIS_PORT"; do
                  echo "waiting for redis ${REDIS_HOST}:${REDIS_PORT}"
                  sleep 2
                done
              fi
          envFrom:
            - configMapRef:
                name: crest-env
            - secretRef:
                name: crest-redis-secret
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: prepare-data-volume
          image: ghcr.io/sevoniva/crest-service:v2.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              for dir in static-resource appearance exportData excel font report custom-drivers i18n; do
                mkdir -p "/work/data/${dir}"
                chmod -R u+rwX,g+rwX,o-rwx "/work/data/${dir}"
                chown -R 10001:10001 "/work/data/${dir}"
              done
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: crest-data
              mountPath: /work/data
        - name: seed-static-resource
          image: ghcr.io/sevoniva/crest-service:v2.0.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              mkdir -p /work/static-resource
              cp -an /opt/apps/staticResource/. /work/static-resource/ 2>/dev/null || true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crest-data
              mountPath: /work/static-resource
              subPath: static-resource
      containers:
        - name: crest-service
          image: ghcr.io/sevoniva/crest-service:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: RUNNING_PORT
              value: "8100"
            - name: JAVA_APP_JAR
              value: /opt/apps/app.jar
            - name: JAVA_OPTS
              value: >-
                -Dfile.encoding=utf-8
                -Djava.awt.headless=true
                -Dloader.path=/opt/apps
                -Djava.io.tmpdir=/opt/crest/tmp
                -Dspring.config.additional-location=/opt/apps/config/
            - name: CREST_RUNTIME_ROLE
              value: api
            - name: CREST_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CREST_PATH_EXCEL
              value: /opt/crest/data/excel/
            - name: CREST_PATH_EXPORT_DATA
              value: /opt/crest/data/exportData/
            - name: CREST_PATH_EHCACHE
              value: /opt/crest/cache
            - name: CREST_LOG_PATH
              value: /opt/crest/logs/crest
          envFrom:
            - configMapRef:
                name: crest-env
            - secretRef:
                name: crest-db-secret
            - secretRef:
                name: crest-redis-secret
                optional: true
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -qO- "http://127.0.0.1:${RUNNING_PORT}${CREST_CONTEXT_PATH:-}/api/v1/actuator/health/liveness" >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -qO- "http://127.0.0.1:${RUNNING_PORT}${CREST_CONTEXT_PATH:-}/api/v1/actuator/health/readiness" >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - wget -qO- "http://127.0.0.1:${RUNNING_PORT}${CREST_CONTEXT_PATH:-}/api/v1/actuator/health/liveness" >/dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crest-app-config
              mountPath: /opt/apps/config/application.yml
              subPath: application.yml
              readOnly: true
            - name: crest-cache
              mountPath: /opt/crest/cache
            - name: crest-logs
              mountPath: /opt/crest/logs/crest
            - name: crest-tmp
              mountPath: /opt/crest/tmp
            - name: crest-data
              mountPath: /opt/crest/data/static-resource
              subPath: static-resource
            - name: crest-data
              mountPath: /opt/crest/data/appearance
              subPath: appearance
            - name: crest-data
              mountPath: /opt/crest/data/exportData
              subPath: exportData
            - name: crest-data
              mountPath: /opt/crest/data/excel
              subPath: excel
            - name: crest-data
              mountPath: /opt/crest/data/font
              subPath: font
            - name: crest-data
              mountPath: /opt/crest/data/report
              subPath: report
            - name: crest-data
              mountPath: /opt/crest/data/custom-drivers
              subPath: custom-drivers
            - name: crest-data
              mountPath: /opt/crest/data/i18n
              subPath: i18n
      volumes:
        - name: crest-app-config
          configMap:
            name: crest-app-config
        - name: crest-cache
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: crest-logs
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: crest-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: crest-data
          persistentVolumeClaim:
            claimName: crest-data
