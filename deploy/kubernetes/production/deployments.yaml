            - name: crest-data
              mountPath: /opt/crest/data/font
              subPath: font
            - name: crest-data
              mountPath: /opt/crest/data/report
              subPath: report
            - name: crest-data
              mountPath: /opt/crest/data/custom-drivers
              subPath: custom-drivers
            - name: crest-data
              mountPath: /opt/crest/data/i18n
