apiVersion: v1
kind: Service
metadata:
  name: crest-service
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: crest-service-api
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crest-data
spec:
  # 生产多副本需要 RWX 存储，保证 API Pod 可读取 Worker Pod 生成的业务文件。
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crest
spec:
  replicas: 2
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: crest
                    app.kubernetes.io/component: frontend
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: crest
              app.kubernetes.io/component: frontend
