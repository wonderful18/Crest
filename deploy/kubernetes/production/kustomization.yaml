namespace: crest-production

resources:
  - namespace.yaml
  - ../base
  - deployments.yaml
  - pdb.yaml
  - hpa.yaml

patches:
  - path: patches/delete-base-backend.yaml
  - path: patches/production-base-patches.yaml

images:
  - name: ghcr.io/sevoniva/crest-service
    newTag: v2.0.1
  - name: ghcr.io/sevoniva/crest-web
    newTag: v2.0.1

configMapGenerator:
  - name: crest-env
    literals:
      - CREST_CONTEXT_PATH=
      - CREST_PRODUCTION_MODE=true
      - CREST_LOAD_DEMO=false
      - CREST_FLYWAY_ENABLED=false
      - CREST_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_CACHE_TYPE=redis
      - SPRING_FLYWAY_ENABLED=false
      - MANAGEMENT_HEALTH_REDIS_ENABLED=true
      - CREST_DB_HOST=mysql.example.com
      - CREST_DB_PORT=3306
      - CREST_DB_NAME=crest
      - CREST_DB_TYPE=mysql
      - CREST_DB_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - CREST_DB_PARAMS=autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - CREST_REDIS_HOST=redis.example.com
      - CREST_REDIS_PORT=6379
      - CREST_REDIS_DATABASE=0
      - CREST_REDIS_USERNAME=
      - CREST_REDIS_CLUSTER_NODES=
      - CREST_REDIS_CLUSTER_MAX_REDIRECTS=3
      - CREST_REDIS_SSL_ENABLED=false
      - CREST_REDIS_CONNECT_TIMEOUT=2s
      - CREST_REDIS_TIMEOUT=5s
      - CREST_REDIS_CLUSTER_REFRESH_ADAPTIVE=true
      - CREST_REDIS_CLUSTER_REFRESH_PERIOD=30s
      - CREST_REDIS_CLUSTER_DYNAMIC_REFRESH_SOURCES=true
      - CREST_PATH_REPORT=/opt/crest/data/report/
      - CREST_PATH_CUSTOM_DRIVERS=/opt/crest/data/custom-drivers/
      - CREST_LOCK_KEY_PREFIX=crest:lock
      - CREST_LOCK_DEFAULT_TTL_SECONDS=1800
      - CREST_TASK_QUEUE_ENABLED=true
      - CREST_EXPORT_TASK_STREAM=crest:stream:export-task
      - CREST_EXPORT_TASK_CONSUMER_GROUP=crest-export-workers
      - CREST_EXPORT_TASK_PENDING_IDLE_MILLIS=60000
      - CREST_SYNC_TASK_STREAM=crest:stream:dataset-sync-task
      - CREST_SYNC_TASK_CONSUMER_GROUP=crest-dataset-sync-workers
      - CREST_SYNC_TASK_RECOVERY_INTERVAL_MILLIS=60000
      - CREST_SYNC_TASK_RECOVERY_BATCH_SIZE=100
      - CREST_SYNC_TASK_STALE_MILLIS=1800000
      - CREST_SYNC_TASK_ENQUEUE_RETRY_MILLIS=60000
      - CREST_SYNC_TASK_PENDING_IDLE_MILLIS=60000
      - CREST_DATASOURCE_SYNC_TASK_STREAM=crest:stream:datasource-sync-task
      - CREST_DATASOURCE_SYNC_TASK_CONSUMER_GROUP=crest-datasource-sync-workers
      - CREST_DATASOURCE_SYNC_TASK_PENDING_IDLE_MILLIS=60000
      - CREST_SCHEDULED_TASK_STREAM=crest:stream:scheduled-task
      - CREST_SCHEDULED_TASK_CONSUMER_GROUP=crest-scheduled-workers
      - CREST_SCHEDULED_TASK_PENDING_IDLE_MILLIS=60000
      - CREST_WEBSOCKET_BROADCAST_ENABLED=true
      - CREST_WEBSOCKET_BROADCAST_CHANNEL=crest:pubsub:websocket
      - CREST_PROMETHEUS_ENABLED=true
      - CREST_ORIGIN_LIST=https://crest.example.com
      - CREST_LOGIN_TIMEOUT=960

generatorOptions:
  disableNameSuffixHash: true
