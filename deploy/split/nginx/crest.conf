upstream crest_backend {
    zone crest_backend 64k;
    server crest-service:8100 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    client_max_body_size 500m;
    client_body_timeout 120s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    send_timeout 120s;
    large_client_header_buffers 4 16k;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; media-src 'self' data: blob: http: https:; object-src 'none'; base-uri 'self'; frame-src 'self' http: https:; frame-ancestors 'self'; form-action 'self'; worker-src 'self' blob:" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Request-Id $request_id always;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /api/v1/actuator/prometheus {
        access_log off;
        return 404;
    }

    location ^~ /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $crest_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $crest_forwarded_proto;
        proxy_set_header X-Forwarded-Host $crest_forwarded_host;
        proxy_set_header X-Forwarded-Port $crest_forwarded_port;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_buffer_size 16k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-Request-Id $request_id always;
        proxy_redirect off;
        proxy_pass http://crest_backend/api/v1/;
    }

    location /websocket {
        if ($http_upgrade !~* "^websocket$") {
            return 400;
        }
        # 该路径仅服务 WebSocket，前置条件已拒绝非 websocket Upgrade，并且转发值固定。
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade "websocket"; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Connection "upgrade"; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Host $crest_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $crest_forwarded_proto;
        proxy_set_header X-Forwarded-Host $crest_forwarded_host;
        proxy_set_header X-Forwarded-Port $crest_forwarded_port;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_redirect off;
        proxy_pass http://crest_backend/websocket;
    }

    location = /doc.html {
        proxy_http_version 1.1;
        proxy_set_header Host $crest_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $crest_forwarded_proto;
        proxy_set_header X-Forwarded-Host $crest_forwarded_host;
        proxy_set_header X-Forwarded-Port $crest_forwarded_port;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_redirect ~^http://[^/]+(/.*)$ $crest_forwarded_proto://$crest_forwarded_host$1;
        proxy_pass http://crest_backend;
    }

    location ~ ^/(v3/api-docs|swagger-ui|swagger-resources|webjars)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host $crest_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $crest_forwarded_proto;
        proxy_set_header X-Forwarded-Host $crest_forwarded_host;
        proxy_set_header X-Forwarded-Port $crest_forwarded_port;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_redirect ~^http://[^/]+(/.*)$ $crest_forwarded_proto://$crest_forwarded_host$1;
        proxy_pass http://crest_backend;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.map$ {
        return 404;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
