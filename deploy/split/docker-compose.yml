services:

  mysql-crest:
    image: ${CREST_MYSQL_IMAGE:-mysql:8.0.43}
    container_name: split-mysql-crest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${CREST_DB_PASSWORD:-crest_local_password}", "--protocol", "tcp"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      MYSQL_ROOT_PASSWORD: ${CREST_DB_PASSWORD:-crest_local_password}
      MYSQL_DATABASE: ${CREST_DB_NAME:-crest}
    volumes:
      - split-mysql-data:/var/lib/mysql
    networks:
      - crest-network

  crest-service:
    image: ${CREST_BACKEND_IMAGE:-crest-service:split}
    container_name: split-crest-service
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_signal: SIGTERM
    stop_grace_period: 15s
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CREST_DB_HOST: mysql-crest
      CREST_DB_PORT: 3306
      CREST_DB_NAME: ${CREST_DB_NAME:-crest}
      CREST_DB_USERNAME: root
      CREST_DB_PASSWORD: ${CREST_DB_PASSWORD:-crest_local_password}
      CREST_DB_PARAMS: autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      CREST_DB_URL: jdbc:mysql://mysql-crest:3306/${CREST_DB_NAME:-crest}?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      CREST_AES_KEY: ${CREST_AES_KEY:-12345678901234567890123456789012}
      CREST_AES_IV: ${CREST_AES_IV:-1234567890123456}
      CREST_CRYPTO_MODE: standard
      CREST_INITIAL_PASSWORD: ${CREST_INITIAL_PASSWORD:-admin}
      CREST_LOAD_DEMO: ${CREST_LOAD_DEMO:-true}
      CREST_FLYWAY_LOCATIONS: ${CREST_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo-migration}
      CREST_ORIGIN_LIST: ${CREST_ORIGIN_LIST:-http://localhost:18100,http://127.0.0.1:18100}
    volumes:
      - split-crest-logs:/opt/crest/logs
      - split-crest-cache:/opt/crest/cache
      - split-crest-data:/opt/crest/data
    depends_on:
      mysql-crest:
        condition: service_healthy
    networks:
      - crest-network

  crest:
    image: ${CREST_FRONTEND_IMAGE:-crest-web:split}
    container_name: split-crest-web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_signal: SIGTERM
    stop_grace_period: 10s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /var/cache/nginx/client_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/proxy_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/fastcgi_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/uwsgi_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/scgi_temp:uid=10001,gid=10001,mode=0755
      - /var/run/nginx:uid=10001,gid=10001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - ${CREST_WEB_PORT:-18100}:8080
    depends_on:
      crest-service:
        condition: service_healthy
    networks:
      - crest-network

networks:
  crest-network:

volumes:
  split-mysql-data:
  split-crest-logs:
  split-crest-cache:
  split-crest-data:
