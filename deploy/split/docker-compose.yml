services:

  mysql-crest:
    image: ${CREST_MYSQL_IMAGE:-mysql:8.0.43}
    container_name: split-mysql-crest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${CREST_DB_PASSWORD:?set CREST_DB_PASSWORD}", "--protocol", "tcp"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      MYSQL_ROOT_PASSWORD: ${CREST_DB_PASSWORD:?set CREST_DB_PASSWORD}
      MYSQL_DATABASE: ${CREST_DB_NAME:-crest}
    volumes:
      - split-mysql-data:/var/lib/mysql
    networks:
      - crest-network

  crest-service:
    image: ${CREST_BACKEND_IMAGE:-crest-service:split}
    container_name: split-crest-service
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_signal: SIGTERM
    stop_grace_period: 15s
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CREST_DB_HOST: mysql-crest
      CREST_DB_PORT: 3306
      CREST_DB_NAME: ${CREST_DB_NAME:-crest}
      CREST_DB_TYPE: ${CREST_DB_TYPE:-mysql}
      CREST_DB_DRIVER_CLASS_NAME: ${CREST_DB_DRIVER_CLASS_NAME:-com.mysql.cj.jdbc.Driver}
      CREST_DB_USERNAME: root
      CREST_DB_PASSWORD: ${CREST_DB_PASSWORD:?set CREST_DB_PASSWORD}
      CREST_DB_PARAMS: autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      CREST_DB_URL: jdbc:mysql://mysql-crest:3306/${CREST_DB_NAME:-crest}?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      CREST_AES_KEY: ${CREST_AES_KEY:?set CREST_AES_KEY}
      CREST_AES_IV: ${CREST_AES_IV:?set CREST_AES_IV}
      CREST_CRYPTO_MODE: standard
      CREST_INITIAL_PASSWORD: ${CREST_INITIAL_PASSWORD:?set CREST_INITIAL_PASSWORD}
      CREST_LOAD_DEMO: ${CREST_LOAD_DEMO:-true}
      CREST_FLYWAY_LOCATIONS: ${CREST_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo-migration}
      CREST_ORIGIN_LIST: ${CREST_ORIGIN_LIST:-http://localhost:18100,http://127.0.0.1:18100}
      CREST_PROMETHEUS_ENABLED: ${CREST_PROMETHEUS_ENABLED:-false}
      CREST_PROMETHEUS_TOKEN: ${CREST_PROMETHEUS_TOKEN:-}
      CREST_PROMETHEUS_MAX_URI_TAGS: ${CREST_PROMETHEUS_MAX_URI_TAGS:-200}
      CREST_GRAFANA_ENABLED: ${CREST_GRAFANA_ENABLED:-false}
      CREST_GRAFANA_PUBLIC_URL: ${CREST_GRAFANA_PUBLIC_URL:-}
    volumes:
      - split-crest-logs:/opt/crest/logs
      - split-crest-cache:/opt/crest/cache
      - split-crest-data:/opt/crest/data
    depends_on:
      mysql-crest:
        condition: service_healthy
    networks:
      - crest-network

  crest:
    image: ${CREST_FRONTEND_IMAGE:-crest-web:split}
    container_name: split-crest-web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_signal: SIGTERM
    stop_grace_period: 10s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /var/cache/nginx/client_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/proxy_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/fastcgi_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/uwsgi_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/scgi_temp:uid=10001,gid=10001,mode=0755
      - /var/run/nginx:uid=10001,gid=10001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - ${CREST_WEB_PORT:-18100}:8080
    depends_on:
      crest-service:
        condition: service_healthy
    networks:
      - crest-network

  crest-prometheus:
    image: ${CREST_PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0}
    container_name: split-crest-prometheus
    profiles:
      - observability
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../../installer/crest/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CREST_PROMETHEUS_TOKEN_FILE:-./prometheus-token}:/etc/prometheus/secrets/crest-token:ro
      - split-prometheus-data:/prometheus
    depends_on:
      crest-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - crest-network

  crest-grafana:
    image: ${CREST_GRAFANA_IMAGE:-grafana/grafana-oss:13.0.1}
    container_name: split-crest-grafana
    profiles:
      - observability
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${CREST_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CREST_GRAFANA_ADMIN_PASSWORD:?set CREST_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: error
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${CREST_GRAFANA_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ../../installer/crest/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - split-grafana-data:/var/lib/grafana
    ports:
      - ${CREST_GRAFANA_PORT:-3000}:3000
    depends_on:
      crest-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - crest-network

networks:
  crest-network:

volumes:
  split-mysql-data:
  split-crest-logs:
  split-crest-cache:
  split-crest-data:
  split-prometheus-data:
  split-grafana-data:
