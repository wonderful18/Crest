spring:
  datasource:
    driver-class-name: ${CREST_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${CREST_DB_URL:jdbc:mysql://127.0.0.1:3306/crest?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CREST_DB_USERNAME:root}
    password: ${CREST_DB_PASSWORD:}
  messages:
    basename: i18n/lic,i18n/core,i18n/permissions,i18n/sync
  flyway:
    enabled: ${CREST_FLYWAY_ENABLED:true}
    table: crest_schema_version
    validate-on-migrate: false
    locations: ${CREST_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo-migration}
    baseline-on-migrate: true
    out-of-order: false

logging:
  level:
    "org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker": ERROR

mybatis-plus:
  mapper-locations: classpath:mybatis/*.xml

crest:
  internal-lite:
    enabled: true
  demo:
    enabled: ${CREST_LOAD_DEMO:true}
