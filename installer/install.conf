# 基础配置
CREST_BASE=/opt
CREST_PORT=8100
CREST_LOGIN_TIMEOUT=960
CREST_CONTEXT_PATH=
# 离线包制作脚本会写入明确版本的前端和后端镜像标签。
CREST_BACKEND_IMAGE=ghcr.io/sevoniva/crest-service:v2.0.0
CREST_FRONTEND_IMAGE=ghcr.io/sevoniva/crest-web:v2.0.0
CREST_MYSQL_IMAGE=mysql:8.0.43
CREST_REDIS_IMAGE=redis:7.4.5-alpine

# 是否初始化内置演示资源；生产环境不需要示例数据时设为 false。
CREST_LOAD_DEMO=true
# 生产多副本模式必须使用 Redis；旧版单机兼容模式可保持 false。
CREST_PRODUCTION_MODE=false
# Crest 系统库 Flyway 初始化开关。留空时安装脚本自动判断：MySQL 默认 true，OceanBase 默认 false。
CREST_FLYWAY_ENABLED=

# 可观测性配置；默认关闭，开启后启动 Prometheus/Grafana 采集和看板。
CREST_PROMETHEUS_ENABLED=false
CREST_PROMETHEUS_TOKEN=
CREST_PROMETHEUS_IMAGE=prom/prometheus:v3.12.0
CREST_PROMETHEUS_MAX_URI_TAGS=200
CREST_GRAFANA_ENABLED=false
CREST_GRAFANA_IMAGE=grafana/grafana-oss:13.0.1
CREST_GRAFANA_PORT=3000
CREST_GRAFANA_ADMIN_USER=admin
CREST_GRAFANA_ADMIN_PASSWORD=
CREST_GRAFANA_PUBLIC_URL=

# 数据库配置
CREST_EXTERNAL_MYSQL=false
CREST_DB_HOST=mysql-crest
CREST_DB_PORT=3306
CREST_DB_NAME=crest
CREST_DB_TYPE=mysql
CREST_DB_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
CREST_DB_URL=
CREST_DB_USERNAME=root
CREST_DB_PASSWORD=
CREST_DB_PARAMS="autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true"

# Redis 配置。默认启动内置 Redis 容器；生产多副本部署可改为外部 Redis 或 Redis Cluster。
# 如旧版单机兼容模式完全不使用 Redis，设置 CREST_INTERNAL_REDIS=false，并保持 CREST_PRODUCTION_MODE=false、CREST_CACHE_TYPE=jcache。
CREST_INTERNAL_REDIS=true
CREST_CACHE_TYPE=jcache
CREST_REDIS_HOST=redis-crest
CREST_REDIS_PORT=6379
CREST_REDIS_USERNAME=
CREST_REDIS_PASSWORD=
CREST_REDIS_DATABASE=0
CREST_REDIS_SSL_ENABLED=false
CREST_REDIS_CONNECT_TIMEOUT=2s
CREST_REDIS_TIMEOUT=5s
CREST_REDIS_CLUSTER_NODES=
CREST_REDIS_CLUSTER_MAX_REDIRECTS=3
CREST_REDIS_CLUSTER_REFRESH_ADAPTIVE=true
CREST_REDIS_CLUSTER_REFRESH_PERIOD=30s
CREST_REDIS_CLUSTER_DYNAMIC_REFRESH_SOURCES=true
CREST_TASK_QUEUE_ENABLED=
CREST_WEBSOCKET_BROADCAST_ENABLED=

# 留空时安装脚本会生成随机值；升级已有环境时不要改动。
CREST_CRYPTO_MODE=standard
CREST_AES_KEY=
CREST_AES_IV=
CREST_SM4_KEY=
CREST_INITIAL_PASSWORD=

# 运行目录派生路径；留空时安装脚本会按 CREST_BASE 自动生成。
CREST_LOG_PATH=
CREST_CACHE_PATH=
CREST_SUBSTITULE_PATH=

# 导出限制
CREST_EXPORT_VIEWS_LIMIT=100000
CREST_EXPORT_DATASET_LIMIT=100000
CREST_ORIGIN_LIST="http://localhost:${CREST_PORT},http://127.0.0.1:${CREST_PORT}"
