services:

  mysql-crest:
    image: ${CREST_MYSQL_IMAGE:-mysql:8.0.43}
    container_name: mysql-crest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u${CREST_DB_USERNAME}", "-p${CREST_DB_PASSWORD}", "--protocol","tcp"]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - ${CREST_RUN_BASE}/conf/mysql.env
    volumes:
      - ${CREST_RUN_BASE}/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ${CREST_RUN_BASE}/data/mysql:/var/lib/mysql
    networks:
      - crest-network

  crest-service:
    image: ${CREST_BACKEND_IMAGE:-ghcr.io/sevoniva/crest-service:v1.5.4}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_signal: SIGTERM
    stop_grace_period: 15s
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    container_name: crest-service
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${CREST_RUN_BASE}/conf:/opt/apps/config:ro
      - ${CREST_RUN_BASE}/logs:/opt/crest/logs
      - ${CREST_RUN_BASE}/data/static-resource:/opt/crest/data/static-resource
      - ${CREST_RUN_BASE}/cache:/opt/crest/cache
      - ${CREST_RUN_BASE}/data/appearance:/opt/crest/data/appearance
      - ${CREST_RUN_BASE}/data/exportData:/opt/crest/data/exportData
      - ${CREST_RUN_BASE}/data/excel:/opt/crest/data/excel
      - ${CREST_RUN_BASE}/data/font:/opt/crest/data/font
      - ${CREST_RUN_BASE}/data/i18n:/opt/crest/data/i18n
      - ${CREST_RUN_BASE}/data/plugin:/opt/crest/data/plugin
    depends_on:
      mysql-crest:
        condition: service_healthy
    networks:
      - crest-network

  crest:
    image: ${CREST_FRONTEND_IMAGE:-ghcr.io/sevoniva/crest-web:v1.5.4}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    stop_signal: SIGTERM
    stop_grace_period: 10s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    container_name: crest
    read_only: true
    tmpfs:
      - /var/cache/nginx/client_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/proxy_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/fastcgi_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/uwsgi_temp:uid=10001,gid=10001,mode=0755
      - /var/cache/nginx/scgi_temp:uid=10001,gid=10001,mode=0755
      - /var/run/nginx:uid=10001,gid=10001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - ${CREST_PORT}:8080
    depends_on:
      crest-service:
        condition: service_healthy
    networks:
      - crest-network

  crest-prometheus:
    image: ${CREST_PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0}
    container_name: crest-prometheus
    profiles:
      - observability
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ${CREST_RUN_BASE}/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CREST_RUN_BASE}/observability/prometheus/rules:/etc/prometheus/rules:ro
      - ${CREST_RUN_BASE}/conf/prometheus-token:/etc/prometheus/secrets/crest-token:ro
      - ${CREST_RUN_BASE}/data/prometheus:/prometheus
    depends_on:
      crest-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy wget -qO- http://127.0.0.1:9090/-/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - crest-network

  crest-grafana:
    image: ${CREST_GRAFANA_IMAGE:-grafana/grafana-oss:13.0.1}
    container_name: crest-grafana
    profiles:
      - observability
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${CREST_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CREST_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: error
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_ROOT_URL: ${CREST_GRAFANA_PUBLIC_URL:-http://localhost:3000}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,::1,crest-prometheus,crest-service,mysql-crest"
      no_proxy: "localhost,127.0.0.1,::1,crest-prometheus,crest-service,mysql-crest"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ${CREST_RUN_BASE}/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${CREST_RUN_BASE}/data/grafana:/var/lib/grafana
    ports:
      - ${CREST_GRAFANA_PORT:-3000}:3000
    depends_on:
      crest-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - crest-network

networks:
  crest-network:
