name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.5.8
        required: true
        default: v1.5.8

permissions:
  contents: write

env:
  R2_BUCKET: crest-releases
  R2_PREFIX: crest-releases
  R2_ENDPOINT: https://12795078d01f49d69370b3e7efa7ea60.r2.cloudflarestorage.com

jobs:
  package:
    name: Package ${{ matrix.package_platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_platform: linux-amd64
            docker_platform: linux/amd64
            arch: amd64
          - package_platform: linux-arm64
            docker_platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          package_json_file: core/core-frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/core-frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: core/core-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:base
          pnpm run build:lite:check

      - name: Build backend
        run: |
          mvn -pl :core-backend -am clean package -Pstandalone -DskipTests -Dmaven.test.skip=true -Dcrest.copy.frontend.skip=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build target-architecture images
        env:
          VERSION: ${{ inputs.version }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          build_image() {
            local image_tag="$1"
            local dockerfile="$2"
            docker buildx build \
              --platform "${DOCKER_PLATFORM}" \
              --file "${dockerfile}" \
              --tag "${image_tag}" \
              --load \
              .
            docker image inspect "${image_tag}" --format '{{.Architecture}}' | grep -qx "${ARCH}"
          }

          pull_image() {
            local source_image="$1"
            local local_image="$2"
            docker pull --platform "${DOCKER_PLATFORM}" "${source_image}"
            docker tag "${source_image}" "${local_image}"
            docker image inspect "${local_image}" --format '{{.Architecture}}' | grep -qx "${ARCH}"
          }

          build_image "crest-service:${VERSION}-${ARCH}" Dockerfile.backend
          build_image "crest-web:${VERSION}-${ARCH}" Dockerfile.frontend
          pull_image "mysql:8.0.43" "mysql:8.0.43-${ARCH}"
          pull_image "prom/prometheus:v3.12.0" "prom/prometheus:v3.12.0-${ARCH}"
          pull_image "grafana/grafana-oss:13.0.1" "grafana/grafana-oss:13.0.1-${ARCH}"

      - name: Build offline package
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
          ARCH: ${{ matrix.arch }}
          INCLUDE_OBSERVABILITY_IMAGES: "true"
          SOURCE_MYSQL_IMAGE: mysql:8.0.43-${{ matrix.arch }}
          MYSQL_IMAGE: mysql:8.0.43
          SOURCE_PROMETHEUS_IMAGE: prom/prometheus:v3.12.0-${{ matrix.arch }}
          PROMETHEUS_IMAGE: prom/prometheus:v3.12.0
          SOURCE_GRAFANA_IMAGE: grafana/grafana-oss:13.0.1-${{ matrix.arch }}
          GRAFANA_IMAGE: grafana/grafana-oss:13.0.1
        run: |
          set -euo pipefail

          SOURCE_BACKEND_IMAGE="crest-service:${VERSION}-${ARCH}" \
          BACKEND_IMAGE="crest-service:${VERSION}-${ARCH}" \
          SOURCE_FRONTEND_IMAGE="crest-web:${VERSION}-${ARCH}" \
          FRONTEND_IMAGE="crest-web:${VERSION}-${ARCH}" \
          bash installer/make-offline-package.sh "${VERSION}" "${PACKAGE_PLATFORM}"

      - name: Verify offline package contents
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          package_dir="crest-offline-${VERSION}-${PACKAGE_PLATFORM}"
          package_file="offline-packages/${package_dir}.tar.gz"
          tar -tzf "${package_file}" > /tmp/crest-offline-package-files.txt

          grep -Fqx "${package_dir}/OFFLINE-README.md" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/install.conf" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/install.sh" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/crest/docker-compose.yml" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.4_to_v1.5.5.sql" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.7_to_v1.5.8.sql" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.13_to_v1.5.14.sql" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/crest-service_${VERSION}-${ARCH}.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/crest-web_${VERSION}-${ARCH}.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/mysql_8.0.43.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/prom_prometheus_v3.12.0.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/grafana_grafana-oss_13.0.1.tar.gz" /tmp/crest-offline-package-files.txt

      - name: Upload package to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1

          package_file="crest-offline-${VERSION}-${PACKAGE_PLATFORM}.tar.gz"
          package_path="offline-packages/${package_file}"
          checksum_path="/tmp/${package_file}.sha256"
          object_prefix="${R2_PREFIX}/${VERSION}"

          (cd offline-packages && sha256sum "${package_file}") > "${checksum_path}"

          aws s3 cp "${package_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress
          aws s3 cp "${checksum_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}.sha256" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress

          expected_size="$(stat -c '%s' "${package_path}")"
          actual_size="$(aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --query ContentLength \
            --output text)"
          test "${expected_size}" = "${actual_size}"

  publish:
    name: Publish release assets
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.version }}

      - name: Download package files from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1
          mkdir -p offline-packages

          for package_platform in linux-amd64 linux-arm64; do
            package_file="crest-offline-${VERSION}-${package_platform}.tar.gz"
            for file in "${package_file}" "${package_file}.sha256"; do
              aws s3 cp \
                "s3://${R2_BUCKET}/${R2_PREFIX}/${VERSION}/${file}" \
                "offline-packages/${file}" \
                --endpoint-url "${R2_ENDPOINT}" \
                --region "${AWS_DEFAULT_REGION}" \
                --no-progress
            done
          done

      - name: Create checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="crest-${VERSION#v}/" HEAD \
            | gzip -c > "offline-packages/crest-source-${VERSION}.tar.gz"
          cd offline-packages
          cat \
            crest-offline-${VERSION}-linux-amd64.tar.gz.sha256 \
            crest-offline-${VERSION}-linux-arm64.tar.gz.sha256 \
            > crest-${VERSION}-checksums.txt
          sha256sum crest-source-${VERSION}.tar.gz \
            >> crest-${VERSION}-checksums.txt

      - name: Upload source and checksums to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for file in \
            "crest-source-${VERSION}.tar.gz" \
            "crest-${VERSION}-checksums.txt"; do
            aws s3 cp "offline-packages/${file}" \
              "s3://${R2_BUCKET}/${R2_PREFIX}/${VERSION}/${file}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --region "${AWS_DEFAULT_REGION}" \
              --no-progress
          done

      - name: Retain latest three R2 versions
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail

          versions="$({
            aws s3api list-objects-v2 \
              --bucket "${R2_BUCKET}" \
              --prefix "${R2_PREFIX}/" \
              --delimiter "/" \
              --endpoint-url "${R2_ENDPOINT}" \
              --region "${AWS_DEFAULT_REGION}" \
              --query 'CommonPrefixes[].Prefix' \
              --output text
          } | tr '\t' '\n' | sed -nE "s#^${R2_PREFIX}/(v[0-9]+(\.[0-9]+)*([.-].*)?)/\$#\1#p" | sort -Vr)"

          retained=0
          while IFS= read -r version; do
            [ -n "${version}" ] || continue
            retained=$((retained + 1))
            if (( retained > 3 )); then
              echo "Removing expired R2 version: ${version}"
                aws s3 rm "s3://${R2_BUCKET}/${R2_PREFIX}/${version}/" \
                --recursive \
                --endpoint-url "${R2_ENDPOINT}" \
                --region "${AWS_DEFAULT_REGION}" \
                --no-progress
            else
              legacy_keys="$({
                aws s3api list-objects-v2 \
                  --bucket "${R2_BUCKET}" \
                  --prefix "${R2_PREFIX}/${version}/crest-offline-" \
                  --endpoint-url "${R2_ENDPOINT}" \
                  --region "${AWS_DEFAULT_REGION}" \
                  --query 'Contents[].Key' \
                  --output text
              } | tr '\t' '\n' | sed '/^None$/d')"
              while IFS= read -r key; do
                [ -n "${key}" ] || continue
                echo "Removing legacy R2 object: ${key}"
                aws s3 rm "s3://${R2_BUCKET}/${key}" \
                  --endpoint-url "${R2_ENDPOINT}" \
                  --region "${AWS_DEFAULT_REGION}" \
                  --no-progress
              done <<< "${legacy_keys}"
            fi
          done <<< "${versions}"

      - name: Create release body
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}
          ASSET_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.version }}
        run: |
          set -euo pipefail

          cp "docs/release/${VERSION}.md" /tmp/crest-release-body.md
          {
            echo
            echo "## Downloads"
            echo
            echo "- [Source package](${ASSET_URL}/crest-source-${VERSION}.tar.gz)"
            echo "- [Checksums](${ASSET_URL}/crest-${VERSION}-checksums.txt)"
            echo
            echo "> 完整系统离线包保存在 R2；应用镜像包请使用下方应用镜像发布任务生成的 crest-app-images 文件。"
          } >> /tmp/crest-release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.version }}
          name: Crest ${{ inputs.version }}
          body_path: /tmp/crest-release-body.md
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            offline-packages/crest-source-${{ inputs.version }}.tar.gz
            offline-packages/crest-${{ inputs.version }}-checksums.txt

      - name: Prepare release notifications
        env:
          VERSION: ${{ inputs.version }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "docs/release/${VERSION}.md"

          python3 - <<'PY'
          import html
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          release_url = f"{base}/releases/tag/{version}"
          source_url = f"{base}/releases/download/{version}/crest-source-{version}.tar.gz"
          checksums_url = f"{base}/releases/download/{version}/crest-{version}-checksums.txt"
          notes = Path(f"docs/release/{version}.md").read_text(encoding="utf-8").strip()

          def email_plain_notes(value: str) -> str:
              lines = []
              for raw_line in value.splitlines():
                  line = raw_line.strip()
                  if not line:
                      lines.append("")
                      continue
                  if re.fullmatch(r"\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?", line):
                      continue
                  line = re.sub(r"^#{1,6}\s*", "", line)
                  line = re.sub(r"\[([^\]]+)\]\((https?://[^)]+)\)", r"\1 (\2)", line)
                  line = line.replace("**", "").replace("__", "").replace("`", "")
                  line = re.sub(r"^[-*+]\s+", "• ", line)
                  lines.append(line)
              return "\n".join(lines).strip()

          def inline_email_html(value: str) -> str:
              value = html.escape(value, quote=False)
              value = re.sub(
                  r"\[([^\]]+)\]\((https?://[^)\s]+)\)",
                  r'<a href="\2">\1</a>',
                  value,
              )
              value = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", value)
              value = re.sub(r"`(.+?)`", r"<code>\1</code>", value)
              return value

          def email_notes_html(value: str) -> str:
              fragments = []
              in_list = False
              for raw_line in value.splitlines():
                  line = raw_line.strip()
                  if not line:
                      if in_list:
                          fragments.append("</ul>")
                          in_list = False
                      continue
                  if re.fullmatch(r"\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?", line):
                      continue
                  if line.startswith("- "):
                      if not in_list:
                          fragments.append("<ul>")
                          in_list = True
                      fragments.append(f"<li>{inline_email_html(line[2:])}</li>")
                      continue
                  if in_list:
                      fragments.append("</ul>")
                      in_list = False
                  if line.startswith("### "):
                      fragments.append(f"<h4>{inline_email_html(line[4:])}</h4>")
                  elif line.startswith("## "):
                      fragments.append(f"<h3>{inline_email_html(line[3:])}</h3>")
                  elif line.startswith("# "):
                      fragments.append(f"<h2>{inline_email_html(line[2:])}</h2>")
                  else:
                      fragments.append(f"<p>{inline_email_html(line)}</p>")
              if in_list:
                  fragments.append("</ul>")
              return "\n".join(fragments)

          email_notes = notes
          title_prefix = f"# {version} "
          if email_notes.startswith(title_prefix) and "\n" in email_notes:
              email_notes = email_notes.split("\n", 1)[1].lstrip()
          plain_notes = email_plain_notes(email_notes)
          notes_html = email_notes_html(email_notes)

          subprocess.run(
              ["git", "fetch", "--force", "--tags", "--depth=1", "origin", version],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )

          def latest_commit(ref: str) -> str | None:
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%H%x09%s", ref],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  return None
              return result.stdout.rstrip("\n")

          commit = latest_commit(version) or latest_commit(os.environ["TRIGGER_SHA"])
          if not commit:
              raise RuntimeError("Unable to resolve the release commit")
          commit_sha, commit_subject = commit.split("\t", 1)
          commit_short = commit_sha[:12]
          commit_url = f"{base}/commit/{commit_sha}"

          def markdown_escape(value: str) -> str:
              return value.replace("\\", "\\\\").replace("[", "\\[").replace("]", "\\]")

          def truncate_utf8(value: str, max_bytes: int) -> str:
              data = value.encode("utf-8")
              if len(data) <= max_bytes:
                  return value
              return data[:max_bytes].decode("utf-8", "ignore").rstrip() + (
                  "\n\n> 发布说明较长，完整内容请查看 GitHub Release 页面。"
              )

          wechat_notes = truncate_utf8(notes, 2800)
          wechat_content = "\n".join([
              f"# Crest {version} 发布完成",
              "",
              "## 发布信息",
              f"- **版本：** `{version}`",
              f"- **最后提交：** [{commit_short} {markdown_escape(commit_subject)}]({commit_url})",
              "",
              "## 发布说明",
              wechat_notes,
              "",
              "## 下载",
              f"- [源代码包]({source_url})",
              f"- [校验文件]({checksums_url})",
              f"- [GitHub Release 页面]({release_url})",
              "",
              "> 完整系统离线包保存在 R2；应用镜像包使用 `crest-app-images` 文件。",
          ])
          Path("/tmp/crest-wechat-content.md").write_text(wechat_content + "\n", encoding="utf-8")

          email_body = "\n".join([
              f"Crest {version} 发布完成",
              "",
              f"版本：{version}",
              f"最后提交：{commit_short} {commit_subject}",
              f"提交链接：{commit_url}",
              "",
              "发布说明：",
              plain_notes,
              "",
              "下载：",
              f"源代码包：{source_url}",
              f"校验文件：{checksums_url}",
              f"GitHub Release 页面：{release_url}",
              "",
              "完整系统离线包保存在 R2；应用镜像包使用 crest-app-images 文件。",
          ])
          Path("/tmp/crest-email-body.txt").write_text(email_body + "\n", encoding="utf-8")
          email_html = f"""<!doctype html>
          <html><body style="margin:0;padding:24px;background:#f6f8fa;color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.6">
          <div style="max-width:760px;margin:0 auto;padding:28px 32px;background:#ffffff;border:1px solid #d0d7de;border-radius:10px">
          <h2 style="margin-top:0">Crest {html.escape(version)} 发布完成</h2>
          <p><strong>版本：</strong>{html.escape(version)}<br><strong>最后提交：</strong><a href="{html.escape(commit_url, quote=True)}">{html.escape(commit_short)} {html.escape(commit_subject)}</a></p>
          <h3>发布说明</h3>
          <div>{notes_html}</div>
          <h3>下载</h3>
          <ul>
            <li><a href="{html.escape(source_url, quote=True)}">源代码包</a></li>
            <li><a href="{html.escape(checksums_url, quote=True)}">校验文件</a></li>
            <li><a href="{html.escape(release_url, quote=True)}">GitHub Release 页面</a></li>
          </ul>
          <p>完整系统离线包保存在 R2；应用镜像包使用 crest-app-images 文件。</p>
          </div></body></html>"""
          Path("/tmp/crest-email-body.html").write_text(email_html, encoding="utf-8")
          PY

      - name: Notify Enterprise WeChat
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          payload="$(jq -n --rawfile content /tmp/crest-wechat-content.md '{msgtype:"markdown",markdown:{content:$content}}')"
          response="$(curl --fail-with-body -sS -X POST "${WECHAT_WEBHOOK_URL}" -H 'Content-Type: application/json' --data "${payload}")"
          jq -e '.errcode == 0' >/dev/null <<<"${response}"

      - name: Notify Gmail
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          user = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          message = EmailMessage()
          message["From"] = user
          message["To"] = user
          message["Subject"] = f"Crest {os.environ['VERSION']} 发布完成"
          message.set_content(Path("/tmp/crest-email-body.txt").read_text(encoding="utf-8"))
          message.add_alternative(Path("/tmp/crest-email-body.html").read_text(encoding="utf-8"), subtype="html")

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(user, password)
              smtp.send_message(message)
          PY
