name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.5.8
        required: true
        default: v1.5.8

permissions:
  contents: write
  packages: read

env:
  R2_BUCKET: crest-releases
  R2_ENDPOINT: https://12795078d01f49d69370b3e7efa7ea60.r2.cloudflarestorage.com
  R2_PUBLIC_BASE_URL: https://downloads.sevoniva.cloud

jobs:
  package:
    name: Package ${{ matrix.package_platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_platform: linux-amd64
            docker_platform: linux/amd64
            arch: amd64
          - package_platform: linux-arm64
            docker_platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Load target-architecture images
        env:
          VERSION: ${{ inputs.version }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/crest-image-load

          load_image() {
            local source_image="$1"
            local local_image="$2"
            printf 'FROM --platform=%s %s\n' "${DOCKER_PLATFORM}" "${source_image}" \
              | docker buildx build --platform "${DOCKER_PLATFORM}" -t "${local_image}" --load -f - /tmp/crest-image-load
            docker image inspect "${local_image}" --format '{{.Architecture}}' | grep -qx "${ARCH}"
          }

          load_image "ghcr.io/sevoniva/crest-service:${VERSION}" "ghcr.io/sevoniva/crest-service:${VERSION}-${ARCH}"
          load_image "ghcr.io/sevoniva/crest-web:${VERSION}" "ghcr.io/sevoniva/crest-web:${VERSION}-${ARCH}"
          load_image "mysql:8.0.43" "mysql:8.0.43-${ARCH}"
          load_image "prom/prometheus:v3.12.0" "prom/prometheus:v3.12.0-${ARCH}"
          load_image "grafana/grafana-oss:13.0.1" "grafana/grafana-oss:13.0.1-${ARCH}"

      - name: Build offline package
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
          ARCH: ${{ matrix.arch }}
          INCLUDE_OBSERVABILITY_IMAGES: "true"
          SOURCE_MYSQL_IMAGE: mysql:8.0.43-${{ matrix.arch }}
          MYSQL_IMAGE: mysql:8.0.43
          SOURCE_PROMETHEUS_IMAGE: prom/prometheus:v3.12.0-${{ matrix.arch }}
          PROMETHEUS_IMAGE: prom/prometheus:v3.12.0
          SOURCE_GRAFANA_IMAGE: grafana/grafana-oss:13.0.1-${{ matrix.arch }}
          GRAFANA_IMAGE: grafana/grafana-oss:13.0.1
        run: |
          set -euo pipefail

          SOURCE_BACKEND_IMAGE="ghcr.io/sevoniva/crest-service:${VERSION}-${ARCH}" \
          BACKEND_IMAGE="ghcr.io/sevoniva/crest-service:${VERSION}-${ARCH}" \
          SOURCE_FRONTEND_IMAGE="ghcr.io/sevoniva/crest-web:${VERSION}-${ARCH}" \
          FRONTEND_IMAGE="ghcr.io/sevoniva/crest-web:${VERSION}-${ARCH}" \
          bash installer/make-offline-package.sh "${VERSION}" "${PACKAGE_PLATFORM}"

      - name: Verify offline package contents
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          package_dir="crest-offline-${VERSION}-${PACKAGE_PLATFORM}"
          package_file="offline-packages/${package_dir}.tar.gz"
          tar -tzf "${package_file}" > /tmp/crest-offline-package-files.txt

          grep -Fqx "${package_dir}/OFFLINE-README.md" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/install.conf" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/install.sh" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/crest/docker-compose.yml" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.4_to_v1.5.5.sql" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.7_to_v1.5.8.sql" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.13_to_v1.5.14.sql" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/ghcr.io_sevoniva_crest-service_${VERSION}-${ARCH}.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/ghcr.io_sevoniva_crest-web_${VERSION}-${ARCH}.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/mysql_8.0.43.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/prom_prometheus_v3.12.0.tar.gz" /tmp/crest-offline-package-files.txt
          grep -Fqx "${package_dir}/images/grafana_grafana-oss_13.0.1.tar.gz" /tmp/crest-offline-package-files.txt

      - name: Upload package to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1

          package_file="crest-offline-${VERSION}-${PACKAGE_PLATFORM}.tar.gz"
          package_path="offline-packages/${package_file}"
          checksum_path="/tmp/${package_file}.sha256"
          object_prefix="releases/${VERSION}"

          (cd offline-packages && sha256sum "${package_file}") > "${checksum_path}"

          aws s3 cp "${package_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress
          aws s3 cp "${checksum_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}.sha256" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress

          expected_size="$(stat -c '%s' "${package_path}")"
          actual_size="$(aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --query ContentLength \
            --output text)"
          test "${expected_size}" = "${actual_size}"

  publish:
    name: Publish release assets
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.version }}

      - name: Download package checksums from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1
          mkdir -p offline-packages

          for package_platform in linux-amd64 linux-arm64; do
            package_file="crest-offline-${VERSION}-${package_platform}.tar.gz"
            aws s3 cp \
              "s3://${R2_BUCKET}/releases/${VERSION}/${package_file}.sha256" \
              "offline-packages/${package_file}.sha256" \
              --endpoint-url "${R2_ENDPOINT}" \
              --region "${AWS_DEFAULT_REGION}" \
              --no-progress
          done

      - name: Create checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="crest-${VERSION#v}/" HEAD \
            | gzip -c > "offline-packages/crest-source-${VERSION}.tar.gz"
          cd offline-packages
          cat \
            crest-offline-${VERSION}-linux-amd64.tar.gz.sha256 \
            crest-offline-${VERSION}-linux-arm64.tar.gz.sha256 \
            > crest-${VERSION}-checksums.txt
          sha256sum crest-source-${VERSION}.tar.gz \
            >> crest-${VERSION}-checksums.txt

      - name: Upload source and checksums to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for file in \
            "crest-source-${VERSION}.tar.gz" \
            "crest-${VERSION}-checksums.txt"; do
            aws s3 cp "offline-packages/${file}" \
              "s3://${R2_BUCKET}/releases/${VERSION}/${file}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --region "${AWS_DEFAULT_REGION}" \
              --no-progress
          done

      - name: Create release body
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cp "docs/release/${VERSION}.md" /tmp/crest-release-body.md
          {
            echo
            echo "## Downloads"
            echo
            echo "- [Offline package (Linux amd64)](${R2_PUBLIC_BASE_URL}/releases/${VERSION}/crest-offline-${VERSION}-linux-amd64.tar.gz)"
            echo "- [Offline package (Linux arm64)](${R2_PUBLIC_BASE_URL}/releases/${VERSION}/crest-offline-${VERSION}-linux-arm64.tar.gz)"
            echo "- [Source package](${R2_PUBLIC_BASE_URL}/releases/${VERSION}/crest-source-${VERSION}.tar.gz)"
            echo "- [Checksums](${R2_PUBLIC_BASE_URL}/releases/${VERSION}/crest-${VERSION}-checksums.txt)"
          } >> /tmp/crest-release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.version }}
          name: Crest ${{ inputs.version }}
          body_path: /tmp/crest-release-body.md
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            offline-packages/crest-${{ inputs.version }}-checksums.txt
