name: Build Release App Image Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.5.8
        required: true
        default: v1.5.8
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean
      make_latest:
        description: Mark this GitHub Release as latest
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  R2_BUCKET: crest-releases
  R2_ENDPOINT: https://12795078d01f49d69370b3e7efa7ea60.r2.cloudflarestorage.com

jobs:
  package:
    name: Package app images ${{ matrix.package_platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_platform: linux-amd64
            docker_platform: linux/amd64
            arch: amd64
          - package_platform: linux-arm64
            docker_platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          package_json_file: core/core-frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/core-frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: core/core-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:base
          pnpm run build:lite:check

      - name: Build backend
        run: |
          mvn -pl :core-backend -am clean package -Pstandalone -DskipTests -Dmaven.test.skip=true -Dcrest.copy.frontend.skip=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build target-architecture app images
        env:
          VERSION: ${{ inputs.version }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          build_image() {
            local image_tag="$1"
            local dockerfile="$2"
            docker buildx build \
              --platform "${DOCKER_PLATFORM}" \
              --file "${dockerfile}" \
              --tag "${image_tag}" \
              --load \
              .
            docker image inspect "${image_tag}" --format '{{.Architecture}}' | grep -qx "${ARCH}"
          }

          build_image "crest-service:${VERSION}-${ARCH}" Dockerfile.backend
          build_image "crest-web:${VERSION}-${ARCH}" Dockerfile.frontend

      - name: Build app image package
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          SOURCE_BACKEND_IMAGE="crest-service:${VERSION}-${ARCH}" \
          BACKEND_IMAGE="crest-service:${VERSION}" \
          SOURCE_FRONTEND_IMAGE="crest-web:${VERSION}-${ARCH}" \
          FRONTEND_IMAGE="crest-web:${VERSION}" \
          bash installer/make-app-image-package.sh "${VERSION}" "${PACKAGE_PLATFORM}"

      - name: Verify app image package contents
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
        run: |
          set -euo pipefail

          package_dir="crest-app-images-${VERSION}-${PACKAGE_PLATFORM}"
          package_file="offline-packages/${package_dir}.tar.gz"
          tar -tzf "${package_file}" > /tmp/crest-app-image-package-files.txt

          grep -Fqx "${package_dir}/APP-IMAGES-README.md" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/load-images.sh" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/image-manifest.txt" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.4_to_v1.5.5.sql" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.7_to_v1.5.8.sql" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.13_to_v1.5.14.sql" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/images/crest-service_${VERSION}.tar.gz" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/images/crest-web_${VERSION}.tar.gz" /tmp/crest-app-image-package-files.txt

      - name: Upload package to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1

          package_file="crest-app-images-${VERSION}-${PACKAGE_PLATFORM}.tar.gz"
          package_path="offline-packages/${package_file}"
          checksum_path="/tmp/${package_file}.sha256"
          object_prefix="releases/${VERSION}"

          (cd offline-packages && sha256sum "${package_file}") > "${checksum_path}"

          aws s3 cp "${package_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress
          aws s3 cp "${checksum_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}.sha256" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress

          expected_size="$(stat -c '%s' "${package_path}")"
          actual_size="$(aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --query ContentLength \
            --output text)"
          test "${expected_size}" = "${actual_size}"

  publish:
    name: Publish app image release assets
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release notes
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Download package files from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1
          mkdir -p offline-packages

          for package_platform in linux-amd64 linux-arm64; do
            package_file="crest-app-images-${VERSION}-${package_platform}.tar.gz"
            for file in "${package_file}" "${package_file}.sha256"; do
              aws s3 cp \
                "s3://${R2_BUCKET}/releases/${VERSION}/${file}" \
                "offline-packages/${file}" \
                --endpoint-url "${R2_ENDPOINT}" \
                --region "${AWS_DEFAULT_REGION}" \
                --no-progress
            done
          done

      - name: Create app image checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd offline-packages
          cat \
            crest-app-images-${VERSION}-linux-amd64.tar.gz.sha256 \
            crest-app-images-${VERSION}-linux-arm64.tar.gz.sha256 \
            > crest-app-images-${VERSION}-checksums.txt

      - name: Upload checksums to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          file="crest-app-images-${VERSION}-checksums.txt"
          aws s3 cp "offline-packages/${file}" \
            "s3://${R2_BUCKET}/releases/${VERSION}/${file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress

      - name: Create release body
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}
          ASSET_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.version }}
        run: |
          set -euo pipefail

          cp "docs/release/${VERSION}.md" /tmp/crest-app-image-release-body.md
          {
            echo
            echo "## Downloads"
            echo
            echo "### Offline package"
            echo
            echo "- [Offline package (Linux amd64)](${ASSET_URL}/crest-offline-${VERSION}-linux-amd64.tar.gz)"
            echo "- [Offline package (Linux arm64)](${ASSET_URL}/crest-offline-${VERSION}-linux-arm64.tar.gz)"
            echo "- [Source package](${ASSET_URL}/crest-source-${VERSION}.tar.gz)"
            echo "- [Offline checksums](${ASSET_URL}/crest-${VERSION}-checksums.txt)"
            echo
            echo "### App image package"
            echo
            echo "- [App image package (Linux amd64)](${ASSET_URL}/crest-app-images-${VERSION}-linux-amd64.tar.gz)"
            echo "- [App image package (Linux arm64)](${ASSET_URL}/crest-app-images-${VERSION}-linux-arm64.tar.gz)"
            echo "- [App image checksums](${ASSET_URL}/crest-app-images-${VERSION}-checksums.txt)"
          } >> /tmp/crest-app-image-release-body.md

      - name: Publish release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.version }}
          name: Crest ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/crest-app-image-release-body.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          overwrite_files: true
          files: |
            offline-packages/crest-app-images-${{ inputs.version }}-linux-amd64.tar.gz
            offline-packages/crest-app-images-${{ inputs.version }}-linux-arm64.tar.gz
            offline-packages/crest-app-images-${{ inputs.version }}-checksums.txt

      - name: Notify Enterprise WeChat
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
          content="Crest ${VERSION} 应用镜像离线包发布完成\n${release_url}\n\namd64: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}/crest-app-images-${VERSION}-linux-amd64.tar.gz\narm64: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${VERSION}/crest-app-images-${VERSION}-linux-arm64.tar.gz"
          payload="$(jq -n --arg content "${content}" '{msgtype:"text",text:{content:$content}}')"
          response="$(curl --fail-with-body -sS -X POST "${WECHAT_WEBHOOK_URL}" -H 'Content-Type: application/json' --data "${payload}")"
          jq -e '.errcode == 0' >/dev/null <<<"${response}"

      - name: Notify Gmail
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          version = os.environ["VERSION"]
          user = os.environ["GMAIL_USERNAME"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          release_url = f"{base}/releases/tag/{version}"
          body = "\n".join([
              f"Crest {version} 应用镜像离线包发布完成",
              release_url,
              "",
              f"amd64: {base}/releases/download/{version}/crest-app-images-{version}-linux-amd64.tar.gz",
              f"arm64: {base}/releases/download/{version}/crest-app-images-{version}-linux-arm64.tar.gz",
          ])

          message = EmailMessage()
          message["From"] = user
          message["To"] = user
          message["Subject"] = f"Crest {version} 应用镜像离线包已发布"
          message.set_content(body)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(user, password)
              smtp.send_message(message)
          PY
