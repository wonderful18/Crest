name: Build Release App Image Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.5.8
        required: true
        default: v1.5.8
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean
      make_latest:
        description: Mark this GitHub Release as latest
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  R2_BUCKET: crest-releases
  R2_ENDPOINT: https://12795078d01f49d69370b3e7efa7ea60.r2.cloudflarestorage.com
  R2_PUBLIC_BASE_URL: https://downloads.sevoniva.cloud

jobs:
  package:
    name: Package app images ${{ matrix.package_platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_platform: linux-amd64
            docker_platform: linux/amd64
            arch: amd64
          - package_platform: linux-arm64
            docker_platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull target-architecture app images
        env:
          VERSION: ${{ inputs.version }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          pull_image() {
            local source_image="$1"
            local local_image="$2"
            docker pull --platform "${DOCKER_PLATFORM}" "${source_image}"
            docker tag "${source_image}" "${local_image}"
            docker image inspect "${local_image}" --format '{{.Architecture}}' | grep -qx "${ARCH}"
          }

          pull_image "ghcr.io/sevoniva/crest-service:${VERSION}" "ghcr.io/sevoniva/crest-service:${VERSION}-${ARCH}"
          pull_image "ghcr.io/sevoniva/crest-web:${VERSION}" "ghcr.io/sevoniva/crest-web:${VERSION}-${ARCH}"

      - name: Build app image package
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          SOURCE_BACKEND_IMAGE="ghcr.io/sevoniva/crest-service:${VERSION}-${ARCH}" \
          BACKEND_IMAGE="ghcr.io/sevoniva/crest-service:${VERSION}" \
          SOURCE_FRONTEND_IMAGE="ghcr.io/sevoniva/crest-web:${VERSION}-${ARCH}" \
          FRONTEND_IMAGE="ghcr.io/sevoniva/crest-web:${VERSION}" \
          bash installer/make-app-image-package.sh "${VERSION}" "${PACKAGE_PLATFORM}"

      - name: Verify app image package contents
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
        run: |
          set -euo pipefail

          package_dir="crest-app-images-${VERSION}-${PACKAGE_PLATFORM}"
          package_file="offline-packages/${package_dir}.tar.gz"
          tar -tzf "${package_file}" > /tmp/crest-app-image-package-files.txt

          grep -Fqx "${package_dir}/APP-IMAGES-README.md" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/load-images.sh" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/image-manifest.txt" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.4_to_v1.5.5.sql" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.7_to_v1.5.8.sql" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/upgrade-sql/v1.5.13_to_v1.5.14.sql" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/images/ghcr.io_sevoniva_crest-service_${VERSION}.tar.gz" /tmp/crest-app-image-package-files.txt
          grep -Fqx "${package_dir}/images/ghcr.io_sevoniva_crest-web_${VERSION}.tar.gz" /tmp/crest-app-image-package-files.txt

      - name: Upload package to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1

          package_file="crest-app-images-${VERSION}-${PACKAGE_PLATFORM}.tar.gz"
          package_path="offline-packages/${package_file}"
          checksum_path="/tmp/${package_file}.sha256"
          object_prefix="releases/${VERSION}"

          (cd offline-packages && sha256sum "${package_file}") > "${checksum_path}"

          aws s3 cp "${package_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress
          aws s3 cp "${checksum_path}" \
            "s3://${R2_BUCKET}/${object_prefix}/${package_file}.sha256" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress

          expected_size="$(stat -c '%s' "${package_path}")"
          actual_size="$(aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${object_prefix}/${package_file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --query ContentLength \
            --output text)"
          test "${expected_size}" = "${actual_size}"

  publish:
    name: Publish app image release assets
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release notes
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Download package checksums from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1
          mkdir -p offline-packages

          for package_platform in linux-amd64 linux-arm64; do
            package_file="crest-app-images-${VERSION}-${package_platform}.tar.gz"
            aws s3 cp \
              "s3://${R2_BUCKET}/releases/${VERSION}/${package_file}.sha256" \
              "offline-packages/${package_file}.sha256" \
              --endpoint-url "${R2_ENDPOINT}" \
              --region "${AWS_DEFAULT_REGION}" \
              --no-progress
          done

      - name: Create app image checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd offline-packages
          cat \
            crest-app-images-${VERSION}-linux-amd64.tar.gz.sha256 \
            crest-app-images-${VERSION}-linux-arm64.tar.gz.sha256 \
            > crest-app-images-${VERSION}-checksums.txt

      - name: Upload checksums to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          file="crest-app-images-${VERSION}-checksums.txt"
          aws s3 cp "offline-packages/${file}" \
            "s3://${R2_BUCKET}/releases/${VERSION}/${file}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --region "${AWS_DEFAULT_REGION}" \
            --no-progress

      - name: Create release body
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cp "docs/release/${VERSION}.md" /tmp/crest-app-image-release-body.md
          {
            echo
            echo "## Downloads"
            echo
            echo "- [App image package (Linux amd64)](${R2_PUBLIC_BASE_URL}/releases/${VERSION}/crest-app-images-${VERSION}-linux-amd64.tar.gz)"
            echo "- [App image package (Linux arm64)](${R2_PUBLIC_BASE_URL}/releases/${VERSION}/crest-app-images-${VERSION}-linux-arm64.tar.gz)"
            echo "- [Checksums](${R2_PUBLIC_BASE_URL}/releases/${VERSION}/crest-app-images-${VERSION}-checksums.txt)"
          } >> /tmp/crest-app-image-release-body.md

      - name: Publish release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.version }}
          name: Crest ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/crest-app-image-release-body.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          overwrite_files: true
          files: |
            offline-packages/crest-app-images-${{ inputs.version }}-checksums.txt
