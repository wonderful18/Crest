name: Build Release App Image Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.1.0
        required: true
        default: v2.1.0

permissions:
  contents: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Package app images ${{ matrix.package_platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_platform: linux-amd64
            docker_platform: linux/amd64
            arch: amd64
          - package_platform: linux-arm64
            docker_platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull target-architecture app images
        env:
          VERSION: ${{ inputs.version }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          pull_image() {
            local source_image="$1"
            local local_image="$2"
            docker pull --platform "${DOCKER_PLATFORM}" "${source_image}"
            docker tag "${source_image}" "${local_image}"
            docker image inspect "${local_image}" --format '{{.Architecture}}' | grep -qx "${ARCH}"
          }

          pull_image "ghcr.io/sevoniva/crest-service:${VERSION}" "ghcr.io/sevoniva/crest-service:${VERSION}-${ARCH}"
          pull_image "ghcr.io/sevoniva/crest-web:${VERSION}" "ghcr.io/sevoniva/crest-web:${VERSION}-${ARCH}"

      - name: Build app image package
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          SOURCE_BACKEND_IMAGE="ghcr.io/sevoniva/crest-service:${VERSION}-${ARCH}" \
          BACKEND_IMAGE="ghcr.io/sevoniva/crest-service:${VERSION}" \
          SOURCE_FRONTEND_IMAGE="ghcr.io/sevoniva/crest-web:${VERSION}-${ARCH}" \
          FRONTEND_IMAGE="ghcr.io/sevoniva/crest-web:${VERSION}" \
          bash installer/make-app-image-package.sh "${VERSION}" "${PACKAGE_PLATFORM}"

      - name: Verify app image package contents
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.package_platform }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-package-contents.sh app-images "${VERSION}" "${PACKAGE_PLATFORM}"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crest-app-images-${{ inputs.version }}-${{ matrix.package_platform }}
          path: offline-packages/crest-app-images-${{ inputs.version }}-${{ matrix.package_platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish app image release assets
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release notes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.version }}

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: offline-packages
          merge-multiple: true

      - name: Create app image checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd offline-packages
          sha256sum \
            crest-app-images-${VERSION}-linux-*.tar.gz \
            > crest-app-images-${VERSION}-checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.version }}
          name: Crest ${{ inputs.version }}
          body_path: docs/release/${{ inputs.version }}.md
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            offline-packages/crest-app-images-${{ inputs.version }}-linux-amd64.tar.gz
            offline-packages/crest-app-images-${{ inputs.version }}-linux-arm64.tar.gz
            offline-packages/crest-app-images-${{ inputs.version }}-checksums.txt
