name: Security Gates

on:
  pull_request:
    branches:
      - main
      - dev
      - 'release/**'
  push:
    branches:
      - main
      - dev
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-gates:
    name: security-gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          package_json_file: core/core-frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/core-frontend/pnpm-lock.yaml

      - name: Install security scanners
        run: |
          set -euo pipefail
          python3 -m pip install --user semgrep==1.168.0
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Run Semgrep SAST
        run: |
          set -euo pipefail
          semgrep scan --error --config p/java --config p/javascript \
            --exclude target \
            --exclude node_modules \
            --exclude core/core-frontend/dist \
            .

      - name: Run frontend production dependency audit
        run: pnpm -C core/core-frontend audit --prod

      - name: Run frontend OSV scan
        run: |
          set -euo pipefail
          osv-scanner scan source \
            --config security/osv-frontend.toml \
            --lockfile core/core-frontend/pnpm-lock.yaml

      - name: Run Maven direct dependency OSV scan
        run: |
          set -euo pipefail
          osv-scanner scan source --no-resolve \
            --lockfile pom.xml \
            --lockfile core/core-backend/pom.xml \
            --lockfile core/core-frontend/pom.xml \
            --lockfile sdk/pom.xml \
            --lockfile sdk/common/pom.xml \
            --lockfile sdk/api/pom.xml \
            --lockfile sdk/extensions/pom.xml

      - name: Run backend security regression tests
        run: |
          set -euo pipefail
          mvn -pl core/core-backend -am \
            -Dtest=io.crest.security.InitialSchemaSecurityTest,io.crest.share.manage.ShareSecretManageTest,io.crest.embedded.server.EmbeddedTokenServerTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dcrest.copy.frontend.skip=true \
            test
